name: Binary Size

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  binary-size:
    name: Check release binary size
    runs-on: ubuntu-latest
    # Budgets are defined by the size-budget table in PHILOSOPHY.md.
    #
    # This job used to measure target/release/minigraf — the CLI/REPL binary —
    # against the engine budget, and reported a 1439 KiB "failure" against a
    # 1024 KiB limit. The engine was never over budget: libminigraf.so is
    # 302 KiB. The check was comparing the wrong artifact.
    env:
      ENGINE_LIMIT_BYTES: 1048576   # 1 MiB — the philosophy commitment
      CLI_LIMIT_BYTES: 3145728      # 3 MiB — runaway guard only, not a goal
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Check core engine size
        run: |
          ENGINE=target/release/libminigraf.so
          if [ ! -f "$ENGINE" ]; then
            echo "FAIL: $ENGINE was not produced; the cdylib crate-type may have been removed"
            exit 1
          fi
          SIZE=$(stat -c %s "$ENGINE")
          echo "Core engine: $(( SIZE / 1024 )) KiB (limit: $(( ENGINE_LIMIT_BYTES / 1024 )) KiB)"
          if [ "$SIZE" -gt "$ENGINE_LIMIT_BYTES" ]; then
            echo "FAIL: the core engine exceeds the philosophy budget in PHILOSOPHY.md"
            exit 1
          fi
          echo "OK: core engine is within the philosophy budget"

      - name: Check CLI binary size
        run: |
          BINARY=target/release/minigraf
          SIZE=$(stat -c %s "$BINARY")
          echo "CLI binary: $(( SIZE / 1024 )) KiB (runaway guard: $(( CLI_LIMIT_BYTES / 1024 )) KiB)"
          if [ "$SIZE" -gt "$CLI_LIMIT_BYTES" ]; then
            echo "FAIL: the CLI binary grew past its runaway guard. This is not a philosophy budget —"
            echo "      investigate what was added, then either trim it or raise CLI_LIMIT_BYTES deliberately."
            exit 1
          fi
          echo "OK: CLI binary is within its runaway guard"
