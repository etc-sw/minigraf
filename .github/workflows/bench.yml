name: Nightly Benchmarks

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "benchmarks/**"
      - "benches/**"
      - "scripts/check-benchmark-*.mjs"
      - "scripts/run-benchmark-gate.sh"
      - "src/**"
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC nightly
  workflow_dispatch:       # allow manual runs

permissions:
  contents: read
  issues: write
  actions: read   # read this workflow's own run history to detect repeat commits

jobs:
  compile:
    name: bench / compile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      has_bencher: ${{ steps.bencher_configured.outputs.has_bencher }}
      is_new_commit: ${{ steps.freshness.outputs.is_new_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The cron fires whether or not anything changed. Between 2026-07-18 and
      # 2026-07-27 that produced ten consecutive nightly runs against the
      # identical commit 2afac62 — roughly 42 CPU-hours spent re-measuring
      # byte-identical code. Benchmark a commit once; a repeat run only
      # re-samples runner noise.
      - name: Detect an already-benchmarked commit
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "is_new_commit=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$EVENT_NAME run; freshness check does not apply."
            exit 0
          fi
          previous="$(gh run list --workflow bench.yml --event schedule \
            --status completed --limit 1 --json headSha --jq '.[0].headSha // ""')"
          if [ "$previous" = "$HEAD_SHA" ]; then
            echo "is_new_commit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$HEAD_SHA was already benchmarked by the previous nightly; skipping the matrix. Use workflow_dispatch to force a re-run."
          else
            echo "is_new_commit=true" >> "$GITHUB_OUTPUT"
          fi

      # The `secrets` context is not available in `if:` conditions, so resolve
      # it once here and expose the answer as a job output. Without a Bencher
      # API key the whole benchmark matrix exists only to upload nowhere, so it
      # is skipped rather than run for 40 minutes and fail.
      - name: Detect Bencher configuration
        id: bencher_configured
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          if [ -n "$BENCHER_API_KEY" ]; then
            echo "has_bencher=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_bencher=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BENCHER_API_KEY is not set; skipping the benchmark matrix. The local coverage and smoke-receipt gates in this job still run."
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Cache bench target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-bench-target-${{ hashFiles('**/Cargo.lock', 'benchmarks/**', 'benches/**', 'src/**/*.rs') }}

      - name: Compile benchmarks
        run: cargo bench --no-run

      - name: Verify nightly benchmark coverage
        run: |
          node scripts/check-benchmark-catalog.mjs
          node scripts/check-benchmark-coverage.mjs

      - name: Produce caller-shaped smoke receipts
        env:
          VICIA_BENCH_SOURCE_COMMIT: ${{ github.sha }}
          VICIA_BENCH_SOURCE_DIRTY: "false"
          VICIA_BENCH_TESTBED: ubuntu-latest-shared
          VICIA_BENCH_BASE_FIXTURE: target/benchmark-receipts/base-10k.graph
        run: |
          ./scripts/run-benchmark-gate.sh smoke target/benchmark-receipts

      - name: Upload caller-shaped smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-caller-shaped-smoke-receipts
          path: target/benchmark-receipts/
          if-no-files-found: error

  benchmark:
    name: bench / ${{ matrix.name }}
    if: >-
      github.event_name != 'pull_request'
      && needs.compile.outputs.has_bencher == 'true'
      && needs.compile.outputs.is_new_commit == 'true'
    runs-on: ubuntu-latest
    needs: [compile]
    timeout-minutes: 360
    strategy:
      fail-fast: false   # one timeout must not cancel sibling jobs
      matrix:
        include:
          # Six jobs, not one per Criterion group. Each job pays ~2-3 minutes of
          # fixed cost (checkout, toolchain, cache restore), so a 26-way matrix
          # spent most of its budget on overhead once the 1M scale rung moved
          # behind MINIGRAF_BENCH_MODE=full. Filters must still cover every
          # Criterion group -- scripts/check-benchmark-coverage.mjs enforces it.

          # ── Write path: insert, file-backed insert, retract ─────────────────
          - name: write
            filter: "^(insert|insert_file|retract)/"
            file: bench_write.txt
            threshold: "0.99"

          # ── Read path: point/join queries, time travel, index lookups ───────
          - name: read
            filter: "^(query|time_travel|btree_lookup|prepared|decay)/"
            file: bench_read.txt
            threshold: "0.99"

          # ── Durability lifecycle: open, WAL replay, checkpoint ──────────────
          - name: lifecycle
            filter: "^(open/|checkpoint)"
            file: bench_lifecycle.txt
            threshold: "0.99"

          # ── Query language surface ─────────────────────────────────────────
          - name: query_features
            filter: "^(negation|disjunction|aggregation|expr|window|temporal_metadata|udf|recursion)/"
            file: bench_query_features.txt
            threshold: "0.99"

          # ── Concurrency ────────────────────────────────────────────────────
          # threshold=0.999: concurrent benchmarks are noisy on shared CI runners
          - name: concurrency
            filter: "^(concurrent/|concurrent_file/|concurrent_btree_scan)"
            file: bench_concurrency.txt
            threshold: "0.999"

          # ── Scalar/SIMD comparison groups ──────────────────────────────────
          - name: simd
            filter: "^simd_"
            file: bench_simd.txt
            threshold: "0.99"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Restore bench target
        uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ runner.os }}-bench-target-${{ hashFiles('**/Cargo.lock', 'benchmarks/**', 'benches/**', 'src/**/*.rs') }}

      - name: Run benchmarks (${{ matrix.name }})
        run: |
          set -o pipefail
          CARGO_TERM_COLOR=never cargo bench -- "${{ matrix.filter }}" \
            2>&1 | tee ${{ matrix.file }}

      # Deliberately unpinned. Bencher's own guidance is to pin only for
      # Bencher Self-Hosted; against Bencher Cloud a pinned old CLI drifts out
      # of compatibility with the live API.
      - name: Install Bencher CLI
        uses: bencherdev/bencher@main

      - name: Upload to Bencher
        id: bencher
        continue-on-error: true
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHER_FILE: ${{ matrix.file }}
          BENCHER_THRESHOLD: ${{ matrix.threshold }}
        run: |
          bencher run \
            --project vicia-db \
            --branch main \
            --testbed ubuntu-latest \
            --threshold-measure latency \
            --threshold-test t_test \
            --threshold-upper-boundary "$BENCHER_THRESHOLD" \
            --error-on-alert \
            --adapter rust_criterion \
            --file "$BENCHER_FILE"

      # Best-effort. Repositories with Issues disabled (the default for a fork)
      # must not turn a benchmark report into a red build.
      - name: Open regression issue
        if: steps.bencher.outcome == 'failure'
        continue-on-error: true
        uses: actions/github-script@v6
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `Benchmark regression - ${today}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'performance',
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.filter(i =>
              i.title.startsWith('Benchmark regression')
            );
            if (existing.length > 0) {
              console.log(`Skipping: open regression issue already exists (#${existing[0].number})`);
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: [
                `Bencher detected a performance regression in the nightly benchmark run (${{ matrix.name }}).`,
                '',
                `**Run:** ${runUrl}`,
                '',
                'Please review the Bencher dashboard for details on which benchmarks regressed.',
              ].join('\n'),
              labels: ['performance'],
            });
